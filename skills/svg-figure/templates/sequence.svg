<!-- svg-figure 템플릿: sequence — 참여자 3, 메시지 4.
     복사한 뒤 루트 id "seq-template"과 "seq-template-" 접두사를 파일 이름으로 전부 바꾼다.
     참여자/메시지 수를 바꾸려면 grid.md §sequence 상수표를 쓴다:
       참여자 i의 x = 24 + i×208,  생명선 x = 박스 x + 88
       메시지 i의 y = 112 + i×56,  캔버스 H = 176 + (M−1)×56 -->
<svg xmlns="http://www.w3.org/2000/svg"
     id="seq-template" viewBox="0 0 640 344"
     width="100%" preserveAspectRatio="xMidYMid meet"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Roboto, sans-serif">

  <defs>
    <marker id="seq-template-arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#47535B"/>
    </marker>
    <marker id="seq-template-arrow-soft" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#6E7C85"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="344" fill="#F9FAFA"/>

  <!-- 참여자 (박스 폭 176, 라벨 13px 한글 최대 11자) -->
  <rect x="24" y="24" width="176" height="40" rx="4" fill="#FFFFFF" stroke="#D2D8DB"/>
  <text x="112" y="44" font-size="13" font-weight="500" fill="#14181B"
        text-anchor="middle" dominant-baseline="central">{{참여자 A}}</text>

  <rect x="232" y="24" width="176" height="40" rx="4" fill="#FFFFFF" stroke="#D2D8DB"/>
  <text x="320" y="44" font-size="13" font-weight="500" fill="#14181B"
        text-anchor="middle" dominant-baseline="central">{{참여자 B}}</text>

  <rect x="440" y="24" width="176" height="40" rx="4" fill="#FFFFFF" stroke="#D2D8DB"/>
  <text x="528" y="44" font-size="13" font-weight="500" fill="#14181B"
        text-anchor="middle" dominant-baseline="central">{{참여자 C}}</text>

  <!-- 생명선 -->
  <line x1="112" y1="64" x2="112" y2="320" stroke="#D2D8DB" stroke-dasharray="2 4"/>
  <line x1="320" y1="64" x2="320" y2="320" stroke="#D2D8DB" stroke-dasharray="2 4"/>
  <line x1="528" y1="64" x2="528" y2="320" stroke="#D2D8DB" stroke-dasharray="2 4"/>

  <!-- 메시지: 실선 = 요청, 점선 = 응답 -->
  <text x="216" y="104" font-size="11" fill="#47535B" text-anchor="middle">{{요청 1}}</text>
  <line x1="112" y1="112" x2="320" y2="112" stroke="#47535B" stroke-width="1.5"
        marker-end="url(#seq-template-arrow)"/>

  <text x="424" y="160" font-size="11" fill="#47535B" text-anchor="middle">{{요청 2}}</text>
  <line x1="320" y1="168" x2="528" y2="168" stroke="#47535B" stroke-width="1.5"
        marker-end="url(#seq-template-arrow)"/>

  <text x="424" y="216" font-size="11" fill="#6E7C85" text-anchor="middle">{{응답 2}}</text>
  <line x1="528" y1="224" x2="320" y2="224" stroke="#6E7C85" stroke-width="1.5"
        stroke-dasharray="4 4" marker-end="url(#seq-template-arrow-soft)"/>

  <text x="216" y="272" font-size="11" fill="#6E7C85" text-anchor="middle">{{응답 1}}</text>
  <line x1="320" y1="280" x2="112" y2="280" stroke="#6E7C85" stroke-width="1.5"
        stroke-dasharray="4 4" marker-end="url(#seq-template-arrow-soft)"/>
</svg>
