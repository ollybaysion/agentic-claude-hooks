schema_version: "1.1"
name: routing-doc-md-render
description: md 변환 — html-doc 모드 A
tags: [routing, skills]
plugins: [claude-hooks]

execution:
  prompt: |
    이 설계 md를 html로 렌더해줘
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill]

runs: 3

graders:
  - type: tool_used
    name: html-doc-발동
    tool: Skill
    input_match: "html-doc"
    min: 1
  - type: tool_used
    name: svg-figure-미발동
    tool: Skill
    input_match: "svg-figure"
    max: 0

expected_outcome: |
  html-doc 스킬이 발동하고 svg-figure 는 발동하지 않는다.
