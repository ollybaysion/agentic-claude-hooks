schema_version: "1.1"
name: routing-figure-architecture
description: 도형+위키, html 단어 없음
tags: [routing, skills]
plugins: [claude-hooks]

execution:
  prompt: |
    아키텍처 그림 하나 그려줘, 위키에 붙일 거야
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill]

runs: 3

graders:
  - type: tool_used
    name: svg-figure-발동
    tool: Skill
    input_match: "svg-figure"
    min: 1
  - type: tool_used
    name: html-doc-미발동
    tool: Skill
    input_match: "html-doc"
    max: 0

expected_outcome: |
  svg-figure 스킬이 발동하고 html-doc 는 발동하지 않는다.
